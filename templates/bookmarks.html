{% extends "base.html" %}

{% block title %}Saved — Newsense{% endblock %}

{% block head %}
<script src="{{ url_for('static', filename='stories.js') }}" defer></script>
{% endblock %}

{% block content %}
<section class="page-intro">
    <div>
        <p class="label reveal">Your library</p>
        <h1 class="page-title reveal reveal-2">Saved <em class="serif-em">for later.</em></h1>
    </div>
    <span class="label reveal reveal-3" id="saved-count"></span>
</section>

<ol class="row-list" id="bookmarks-container" aria-live="polite">
    {% for i in range(3) %}
    <li class="row-item" aria-hidden="true">
        <span class="label">{{ '%02d' % (i + 1) }}</span>
        <div>
            <div class="skeleton-line" style="width: 80%; height: 20px"></div>
            <div class="skeleton-line" style="width: 25%; margin-top: 10px"></div>
        </div>
        <span></span>
    </li>
    {% endfor %}
</ol>

<script>
document.addEventListener('DOMContentLoaded', loadBookmarks);

function loadBookmarks() {
    const container = document.getElementById('bookmarks-container');
    const count = document.getElementById('saved-count');

    fetch('/get_bookmarks')
        .then(response => response.json())
        .then(data => {
            const items = data.bookmarks || [];
            count.textContent = `${String(items.length).padStart(2, '0')} stories`;

            if (!items.length) {
                container.innerHTML = `
                    <li class="empty-state">
                        <span class="label">Nothing saved</span>
                        <p class="display">Your library is empty.</p>
                        <p class="lede">Use the bookmark on any story to keep it here for later.</p>
                    </li>`;
                return;
            }

            container.innerHTML = '';
            items.forEach((b, i) => {
                const li = document.createElement('li');
                li.className = 'row-item';
                const reader = Stories.readerUrl({ url: b.url, title: b.title });
                li.innerHTML = `
                    <span class="label">${String(i + 1).padStart(2, '0')}</span>
                    <div>
                        <a href="${reader}"><h3 class="row-title">${Stories.esc(b.title || b.url)}</h3></a>
                        <span class="label">Saved ${Stories.esc(Stories.timeAgo(b.bookmarked_at))}</span>
                    </div>
                    <div class="row-actions">
                        <a class="label" href="${Stories.esc(b.url)}" target="_blank" rel="noopener">Original &nearr;</a>
                        <button type="button" class="btn btn-sm btn-danger" data-remove>Remove</button>
                    </div>`;
                li.querySelector('[data-remove]').addEventListener('click', () => removeBookmark(b.url, li));
                container.appendChild(li);
            });
        })
        .catch(error => {
            console.error('Error loading bookmarks:', error);
            container.innerHTML = `
                <li class="empty-state">
                    <span class="label label-accent">Connection lost</span>
                    <p class="display">Couldn&rsquo;t load your library.</p>
                </li>`;
        });
}

function removeBookmark(url, row) {
    fetch('/remove_bookmark', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': Stories.csrf()
        },
        body: JSON.stringify({ url })
    })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                row.style.opacity = '0.3';
                Stories.toast('Removed from saved');
                setTimeout(loadBookmarks, 250);
            }
        })
        .catch(() => Stories.toast('Could not remove story'));
}
</script>
{% endblock %}
